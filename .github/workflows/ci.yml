name: Sales Forecasting CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.api
          push: false
          tags: sales-forecast-api:ci
          cache-from: type=gha,scope=sales-forecast-api
          cache-to: type=gha,mode=max,scope=sales-forecast-api

      - name: Build Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.streamlit
          push: false
          tags: sales-forecast-frontend:ci
          cache-from: type=gha,scope=sales-forecast-frontend
          cache-to: type=gha,mode=max,scope=sales-forecast-frontend
